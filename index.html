<!DOCTYPE html>
<html lang="th">
  <head>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@^19.1.0",
          "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
          "react/": "https://esm.sh/react@^19.1.0/",
          "@google/genai": "https://esm.sh/@google/genai@^1.3.0"
        }
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>สนาม รินน้ำ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2D7kSs0v4LLanw2qksYuRlEzO+tcaEPQogQ0KaoGN26/zrn20ImR1DfuLWnOo7aBA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;700&display=swap');
      
      :root {
        --font-main: 'Kanit', sans-serif;
        --font-alt: 'Sarabun', serif; /* Kept for potential secondary use */
        --font-heading: 'Kanit', sans-serif; /* Consistent heading font */

        /* Default to orange-dark theme variables */
        --bg-color: #121212; 
        --text-color: #e0e0e0; 
        --text-muted-color: #a0a0a0; 
        --accent-color: #fb923c; /* Orange-400 */
        --accent-hover-color: #f97316; /* Orange-500 */
        --card-bg-color: #1e1e1e; 
        --border-color: #3a3a3a; 
        --button-text-color: #121212; /* For buttons with accent bg */
        --input-bg-color: #2c2c2c; 
        --input-text-color: #e0e0e0; 
        --input-border-color: #4a4a4a;
        --shadow-color-rgb: 251, 146, 60; /* RGB for accent-color (orange-400) */
        --success-color: #22c55e; /* Green-500 */
        --error-color: #ef4444; /* Red-500 */
        --info-color: #3b82f6; /* Blue-500 */
        --highlight-color: #f59e0b; /* Amber-500 for highlights in dark mode */
      }
      
      html.light {
        --bg-color: #f4f4f5; /* Zinc-100 */
        --text-color: #18181b; /* Zinc-900 */
        --text-muted-color: #71717a; /* Zinc-500 */
        --accent-color: #f97316; /* Orange-500 */
        --accent-hover-color: #ea580c; /* Orange-600 */
        --card-bg-color: #ffffff; /* White */
        --border-color: #d4d4d8; /* Zinc-300 */
        --button-text-color: #ffffff; /* White text for accent buttons */
        --input-bg-color: #ffffff; 
        --input-text-color: #18181b; 
        --input-border-color: #a1a1aa; /* Zinc-400 */
        --shadow-color-rgb: 249, 115, 22; /* RGB for accent-color (orange-500) for light theme */
        --highlight-color: #d97706; /* Amber-600 for highlights in light mode */
      }

      body {
        font-family: var(--font-main); 
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background-color: var(--card-bg-color); 
      }
      ::-webkit-scrollbar-thumb {
        background-color: var(--accent-color);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--accent-hover-color);
      }
    </style>
    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        content: ["./src/**/*.{js,ts,jsx,tsx}", "./index.html"],
        darkMode: 'class', 
        theme: {
          extend: {
            colors: {
              'bg-theme': 'var(--bg-color)',
              'text-theme': 'var(--text-color)',
              'text-muted-theme': 'var(--text-muted-color)',
              'accent-theme': 'var(--accent-color)',
              'accent-hover-theme': 'var(--accent-hover-color)',
              'card-bg-theme': 'var(--card-bg-color)',
              'border-theme': 'var(--border-color)',
              'button-text-theme': 'var(--button-text-color)',
              'input-bg-theme': 'var(--input-bg-color)',
              'input-text-theme': 'var(--input-text-color)',
              'input-border-theme': 'var(--input-border-color)',
              'success-theme': 'var(--success-color)',
              'error-theme': 'var(--error-color)',
              'info-theme': 'var(--info-color)',
              'highlight-theme': 'var(--highlight-color)',
            },
            fontFamily: {
              main: ['Kanit', 'sans-serif'],
              alt: ['Sarabun', 'serif'],
              heading: ['Kanit', 'sans-serif'],
            },
            boxShadow: {
              'card-theme': `0 4px 12px -1px rgba(var(--shadow-color-rgb), 0.08), 0 2px 8px -1px rgba(var(--shadow-color-rgb), 0.05)`,
              'card-hover-theme': `0 10px 20px -3px rgba(var(--shadow-color-rgb), 0.12), 0 4px 12px -2px rgba(var(--shadow-color-rgb), 0.08)`,
              'button-theme': `0 2px 6px 0 rgba(var(--shadow-color-rgb), 0.15)`,
            },
             borderRadius: {
              'xl': '0.75rem', // 12px
              '2xl': '1rem',   // 16px
              '3xl': '1.5rem', // 24px
            },
          },
        },
         plugins: [],
      };
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <noscript>คุณต้องเปิดใช้งาน JavaScript เพื่อใช้งานแอปพลิเคชันนี้</noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
